[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "waf-inventory"
version = "0.2.1"
description = "Read-only inventory of apps, WAF configuration and discovered APIs behind Azure WAF and F5 BIG-IP"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Rezztor Technologies (Private) Limited" }]
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "httpx>=0.27,<1",
    "azure-identity>=1.17,<2",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "jinja2>=3.1,<4",
    "openpyxl>=3.1,<4",
    "argon2-cffi>=23.1,<26",
    "cryptography>=42",
    "paramiko>=3.4,<5",
    "python-multipart>=0.0.9",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
waf-inv = "waf_inventory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
waf_inventory = ["templates/*.html", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E741", "E501"]
