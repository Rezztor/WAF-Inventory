#TMSH-VERSION: 17.1.1

sys global-settings {
    gui-setup disabled
    hostname dc1-bigip01.corp.contoso.com
}
asm policy /Common/app1_waf {
    active
    blocking-mode enabled
    encoding utf-8
    policy-builder disabled
    policy-template POLICY_TEMPLATE_RAPID_DEPLOYMENT
    policy-type security
}
asm policy /Common/app1_api_waf {
    active
    blocking-mode enabled
    encoding utf-8
    policy-builder disabled
    policy-template POLICY_TEMPLATE_API_SECURITY
    policy-type security
}
asm policy /Common/hr_waf {
    active
    blocking-mode disabled
    encoding utf-8
    policy-builder enabled
    policy-template POLICY_TEMPLATE_COMPREHENSIVE
    policy-type security
}
asm policy /Common/intranet_waf {
    active
    blocking-mode enabled
    encoding utf-8
    policy-template POLICY_TEMPLATE_FUNDAMENTAL
    policy-type security
}
asm policy /Common/old_unused_waf {
    blocking-mode enabled
    encoding utf-8
    policy-template POLICY_TEMPLATE_RAPID_DEPLOYMENT
    policy-type security
}
asm policy /Partner/partner_api_waf {
    active
    blocking-mode enabled
    encoding utf-8
    policy-template POLICY_TEMPLATE_API_SECURITY
    policy-type security
}
ltm node /Common/10.10.30.11 {
    address 10.10.30.11
}
ltm pool /Common/pool_app1 {
    members {
        /Common/10.10.30.11:8080 {
            address 10.10.30.11
        }
        /Common/10.10.30.12:8080 {
            address 10.10.30.12
        }
    }
    monitor /Common/http
}
ltm pool /Common/pool_app1_api {
    members {
        /Common/10.10.31.21:8443 {
            address 10.10.31.21
        }
    }
    monitor /Common/https
}
ltm pool /Common/pool_hr {
    members {
        /Common/10.10.32.5:443 {
            address 10.10.32.5
        }
    }
}
ltm pool /Common/pool_selfservice {
    members {
        /Common/10.10.32.6:443 {
            address 10.10.32.6
        }
    }
}
ltm pool /Common/pool_intranet {
    members {
        /Common/10.10.33.10:80 {
            address 10.10.33.10
        }
    }
}
ltm pool /Common/pool_legacy {
    members {
        /Common/10.10.34.2:80 {
            address 10.10.34.2
        }
    }
}
ltm pool /Partner/pool_partner_api {
    members {
        /Partner/10.30.1.15%2:443 {
            address 10.30.1.15%2
        }
    }
}
ltm policy /Common/asm_app1 {
    controls { asm forwarding }
    requires { http }
    rules {
        api_path {
            actions {
                0 {
                    asm
                    enable
                    policy /Common/app1_api_waf
                }
                1 {
                    forward
                    select
                    pool /Common/pool_app1_api
                }
            }
            conditions {
                0 {
                    http-uri
                    path
                    starts-with
                    values { /api/ }
                }
            }
        }
        default {
            actions {
                0 {
                    asm
                    enable
                    policy /Common/app1_waf
                }
            }
            ordinal 1
        }
    }
    strategy /Common/first-match
}
ltm policy /Common/asm_hr {
    controls { asm forwarding }
    requires { http }
    rules {
        hr {
            actions {
                0 {
                    asm
                    enable
                    policy /Common/hr_waf
                }
            }
            conditions {
                0 {
                    http-host
                    host
                    values { hr.corp.contoso.com }
                }
            }
            ordinal 1
        }
        selfservice {
            actions {
                0 {
                    asm
                    enable
                    policy /Common/hr_waf
                }
                1 {
                    forward
                    select
                    pool /Common/pool_selfservice
                }
            }
            conditions {
                0 {
                    http-host
                    host
                    values { selfservice.corp.contoso.com }
                }
            }
            ordinal 2
        }
        healthcheck {
            actions {
                0 {
                    asm
                    disable
                }
            }
            conditions {
                0 {
                    http-uri
                    path
                    values { /healthz }
                }
            }
        }
    }
    strategy /Common/first-match
}
ltm policy /Common/Drafts/asm_app1_new {
    controls { asm }
    requires { http }
    status legacy
    strategy /Common/first-match
}
ltm policy /Partner/asm_partner {
    controls { asm }
    requires { http }
    rules {
        default {
            actions {
                0 {
                    asm
                    enable
                    policy /Partner/partner_api_waf
                }
            }
        }
    }
    strategy /Common/first-match
}
ltm profile client-ssl /Common/clientssl-app1 {
    app-service none
    cert-key-chain {
        app1_cert {
            cert /Common/app1.corp.contoso.com.crt
            key /Common/app1.corp.contoso.com.key
        }
    }
    defaults-from /Common/clientssl
    server-name app1.corp.contoso.com
    sni-default true
}
ltm profile client-ssl /Common/clientssl-hr {
    cert-key-chain {
        hr_cert {
            cert /Common/wildcard.corp.contoso.com.crt
            key /Common/wildcard.corp.contoso.com.key
        }
    }
    defaults-from /Common/clientssl
    server-name none
}
ltm profile client-ssl /Common/clientssl-partner {
    defaults-from /Common/clientssl
    server-name partner-api.contoso.com
}
ltm profile http /Common/http-xff {
    defaults-from /Common/http
    insert-xforwarded-for enabled
}
ltm rule /Common/irule_asm_intranet {
when HTTP_REQUEST {
    # Only protect the intranet portal, pass health checks through
    if { [HTTP::uri] starts_with "/status" } {
        ASM::disable
    } else {
        ASM::enable /Common/intranet_waf
    }
}
}
ltm rule /Common/irule_redirect_https {
when HTTP_REQUEST {
    HTTP::redirect "https://[getfield [HTTP::host] ":" 1][HTTP::uri]"
}
}
ltm virtual /Common/vs_app1_https {
    creation-time 2024-03-11:09:12:44
    destination /Common/10.10.20.10:443
    ip-protocol tcp
    mask 255.255.255.255
    policies {
        /Common/asm_app1 { }
    }
    pool /Common/pool_app1
    profiles {
        /Common/clientssl-app1 {
            context clientside
        }
        /Common/http-xff { }
        /Common/serverssl {
            context serverside
        }
        /Common/tcp { }
        /Common/websecurity { }
    }
    security-log-profiles {
        "/Common/Log illegal requests"
    }
    serverssl-use-sni disabled
    source 0.0.0.0/0
    source-address-translation {
        type automap
    }
    translate-address enabled
    translate-port enabled
}
ltm virtual /Common/vs_hr_https {
    destination /Common/10.10.20.11:443
    ip-protocol tcp
    mask 255.255.255.255
    policies {
        /Common/asm_hr { }
    }
    pool /Common/pool_hr
    profiles {
        /Common/clientssl-hr {
            context clientside
        }
        /Common/http { }
        /Common/tcp { }
        /Common/websecurity { }
    }
    source 0.0.0.0/0
    translate-address enabled
    translate-port enabled
}
ltm virtual /Common/vs_intranet_http {
    destination /Common/10.10.20.12:80
    ip-protocol tcp
    mask 255.255.255.255
    pool /Common/pool_intranet
    profiles {
        /Common/http { }
        /Common/tcp { }
        /Common/websecurity { }
    }
    rules {
        /Common/irule_asm_intranet
    }
    source 0.0.0.0/0
    translate-address enabled
    translate-port enabled
}
ltm virtual /Common/vs_legacy_http {
    destination /Common/10.10.20.13:80
    ip-protocol tcp
    mask 255.255.255.255
    pool /Common/pool_legacy
    profiles {
        /Common/http { }
        /Common/tcp { }
    }
    rules {
        /Common/irule_redirect_https
    }
    source 0.0.0.0/0
    translate-address enabled
    translate-port enabled
}
ltm virtual /Common/vs_ssh_fwd {
    destination /Common/10.10.20.14:22
    ip-protocol tcp
    mask 255.255.255.255
    pool /Common/pool_legacy
    profiles {
        /Common/tcp { }
    }
    source 0.0.0.0/0
}
ltm virtual /Partner/vs_partner_api {
    destination /Partner/10.30.0.10%2:443
    ip-protocol tcp
    mask 255.255.255.255
    policies {
        /Partner/asm_partner { }
    }
    pool /Partner/pool_partner_api
    profiles {
        /Common/clientssl-partner {
            context clientside
        }
        /Common/http { }
        /Common/tcp { }
        /Common/websecurity { }
    }
    source 0.0.0.0/0
    translate-address enabled
    translate-port enabled
}
