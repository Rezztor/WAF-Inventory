{% extends "_settings.html" %}
{% block settings %}
<form class="panel stack" method="post" action="/settings" style="max-width:620px"><input type="hidden" name="csrf" value="{{ csrf }}">
<h2>API discovery</h2>
<label>Distinct values before a path segment becomes a parameter<input name="collapse_threshold" value="{{ general.collapse_threshold }}" inputmode="numeric">
<small>/api/users/1, /api/users/2 … become /api/users/{id} once this many different values are seen.</small></label>
<label>Requests needed to count an endpoint as confirmed<input name="min_hits" value="{{ general.min_hits }}" inputmode="numeric"></label>
<h2>History</h2>
<label>Keep job history for this many days<input name="job_retention_days" value="{{ general.job_retention_days }}" inputmode="numeric">
<small>The audit log is kept for good.</small></label>
<div class="actions"><button class="primary">Save</button></div>
<p class="muted">Path overrides and OpenAPI specs for shadow-API findings still come from the config file, if there is one.</p>
</form>
{% endblock %}
