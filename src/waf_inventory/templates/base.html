<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}WAF Inventory{% endblock %}</title>
{% include "_style.html" %}
</head><body>

<main>{% block body %}{% endblock %}</main>
</body></html>
