{% extends "base.html" %}
{% block title %}Sign in · WAF Inventory{% endblock %}
{% block public %}
<form class="login card" method="post" action="/login">
<div class="brand" style="padding:0"><div class="logo" aria-hidden="true">W</div><div style="line-height:1.25"><div style="font-weight:700;font-size:14px">WAF Inventory</div><div class="hint">Rezztor</div></div></div>
<h1 class="big">Sign in</h1>
{% if notice %}<p class="note" role="status">{{ notice }}</p>{% endif %}
{% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
<input type="hidden" name="next" value="{{ next }}">
<label>Username<input name="username" value="{{ username or '' }}" autocomplete="username" required autofocus></label>
<label>Password<input name="password" type="password" autocomplete="current-password" required></label>
<button class="primary">Sign in</button>
</form>
{% endblock %}
