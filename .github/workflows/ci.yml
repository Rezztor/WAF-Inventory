name: CI

# Push only, never pull_request: the repository is public and runs on Rezztor's own runner, so a pull request from a
# fork would run its code there. Our pull requests come from branches here, so their pushes are tested.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # GitHub-hosted runners are not used (Actions billing); each job runs in a container on the CI VM.
    runs-on: [self-hosted, linux, ci-vm]
    container: python:${{ matrix.python }}-slim
    timeout-minutes: 20
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - run: pip install -e ".[test]" ruff==0.6.9
      - run: ruff check src tests
      - run: pytest -q
      - name: Demo end-to-end
        run: |
          waf-inv -c examples/demo.toml collect
          waf-inv -c examples/demo.toml export -f xlsx -o inventory.xlsx
          waf-inv -c examples/demo.toml export -f html -o report.html
          waf-inv -c examples/demo.toml export -f openapi -o openapi
